<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ song_name }} - Karaoke</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .karaoke-video {
            margin: 30px auto;
            max-width: 800px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        iframe {
            width: 100%;
            height: 450px;
            border: none;
        }
    </style>
</head>
<body class="dark">
    <h2>🎤 {{ song_name }} Karaoke</h2>
    <p class="subtitle">Sing along with embedded video</p>

    <div class="karaoke-video">
        <iframe src="{{ youtube_url }}" allowfullscreen></iframe>
    </div>

    <footer>Created by <strong>SHOBHIT JAIN</strong></footer>
</body>
</html>
