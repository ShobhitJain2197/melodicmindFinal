<!DOCTYPE html>
<html>
<head>
    <title>{{ song_name.replace('.txt', '').title() }} - Karaoke</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .karaoke-box {
            background-color: #181818;
            color: #00ff99;
            margin: 40px auto;
            padding: 30px;
            width: 70%;
            font-size: 1.3em;
            border-radius: 15px;
            font-family: 'Segoe UI', sans-serif;
            line-height: 2em;
            overflow-y: scroll;
            height: 400px;
        }

        .karaoke-box::-webkit-scrollbar {
            width: 10px;
        }

        .karaoke-box::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
        }

        .scroll-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            background: #00ff99;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body class="dark">

    <h2>🎶 {{ song_name.replace('.txt', '').replace('_', ' ').title() }}</h2>
    <p class="subtitle">Sing along with scrolling lyrics</p>

    <div class="karaoke-box" id="karaokeBox">
        {% for line in lines %}
        <div>{{ line.strip() }}</div>
        {% endfor %}
    </div>

    <button class="scroll-btn" onclick="startScroll()">▶️ Start Auto Scroll</button>

    <footer>Created by <strong>SHOBHIT JAIN</strong></footer>

    <script>
        let scrollInterval;

        function startScroll() {
            const box = document.getElementById('karaokeBox');
            clearInterval(scrollInterval);
            scrollInterval = setInterval(() => {
                box.scrollTop += 1;
            }, 100);
        }
    </script>

</body>
</html>
